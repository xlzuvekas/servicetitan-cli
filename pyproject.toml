[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicetitan-cli"
version = "0.1.0"
description = "Unofficial, third-party command-line tool and MCP server for ServiceTitan data, built for AI agents: multi-tenant credentials stored in the OS keychain, JSON everywhere, derived operations metrics, and every ServiceTitan API operation as a command (reads by default, writes behind explicit gates). Not affiliated with ServiceTitan."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Business Bots" }]
keywords = ["servicetitan", "cli", "agents", "home-services", "dashboard"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]
dependencies = [
  "requests>=2.28",
  "keyring>=24",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]
# Local semantic index (servicetitan index ..., --save). Python 3.10+; the default local embedding model
# (fastembed, ONNX, no compiler) supports up to Python 3.12. On 3.13 use llama-index-embeddings-huggingface.
index = [
  "llama-index-core>=0.12; python_version >= '3.10'",
  "llama-index-embeddings-fastembed>=0.3; python_version >= '3.10' and python_version < '3.13'",
  "fastembed>=0.3; python_version >= '3.10' and python_version < '3.13'",
]

[project.scripts]
servicetitan = "servicetitan_cli.cli:main"

[project.urls]
Homepage = "https://github.com/xlzuvekas/servicetitan-cli"
Issues = "https://github.com/xlzuvekas/servicetitan-cli/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servicetitan_cli = ["data/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
