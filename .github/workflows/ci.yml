name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Smoke (demo snapshot end to end)
        shell: bash
        run: |
          export SERVICETITAN_HOME="$RUNNER_TEMP/st-home" SERVICETITAN_SECRETS=file
          servicetitan demo --out demo.json --compact
          servicetitan check --data demo.json --compact
          servicetitan metrics all --data demo.json --compact > /dev/null
          servicetitan list invoices --data demo.json --sort=-balance --limit 3 --compact > /dev/null
          servicetitan render --data demo.json --out dashboard.html --compact
          servicetitan api endpoints --search jobs --compact > /dev/null
          servicetitan schema --compact > /dev/null
