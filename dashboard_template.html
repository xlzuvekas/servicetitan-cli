    csr:name, calls:c.calls, booked:c.booked,
    bookRate: c.calls? c.booked/c.calls*100:0
  })).sort((a,b)=>b.calls-a.calls);
  const unanswered = sum(calls.filter(c=>!c.agentName), c=>c.n);

  container.innerHTML = `
    <div class="kpi-row">
      ${statTile({label:"Inbound Calls", value: fmtNum(inboundN), meta:`<span>${fmtNum(outbound)} outbound not counted</span>`})}
      ${statTile({label:"Booked", value: fmtNum(booked), meta:`<span>${fmtPct(bookRate)} of inbound</span>`})}
      ${statTile({label:"Abandoned", value: fmtNum(abandoned), meta:`<span class="${abandonRate>10?'delta-down':''}">${fmtPct(abandonRate)} of inbound</span>`})}
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>Call Volume</h3><p class="card-sub">Inbound, booked and abandoned over time</p>
      ${legendHTML(seriesData.map(s=>({label:s.label,colorIdx:s.colorIdx})))}
      ${days.length ? lineChart({seriesData, area:false, valueFmt:fmtNum}) : emptyNote("No calls in this period.")}
    </div>
    <div class="card">
      <h3>By Agent</h3><p class="card-sub">Answered inbound calls and how many were booked</p>
      ${agentRows.length ? tableHTML([
        {label:"Agent", key:"csr"},
        {label:"Answered", key:"calls", num:true},
        {label:"Booked", key:"booked", num:true},
        {label:"Book Rate", num:true, render:r=>fmtPct(r.bookRate)}
      ], agentRows) : emptyNote("No answered inbound calls in this period.")}
      <p class="card-sub" style="margin-top:12px;">${fmtNum(unanswered)} inbound call${unanswered===1?"":"s"} reached no agent and are excluded here \u2014 abandonment is a company-wide number, shown above.</p>
    </div>
  `;
  wireTooltips(container);
}

function renderMemberships(container){
  const rows = MEMBERSHIPS.filter(m=>locMatch(m.loc));
  const active = rows.filter(m=>m.active);
  // Plans come from the tenant's own membership types, so this adapts on its own
  // if plans are added or renamed in ServiceTitan.
  const planCounts = {};
  active.forEach(m=>{ planCounts[m.plan] = (planCounts[m.plan]||0)+1; });
  const byPlan = Object.entries(planCounts).map(([label,v])=>({label,v})).sort((a,b)=>b.v-a.v);

  const daysOut = m => m.renewDate ? (m.renewDate-TODAY)/86400000 : null;
  const renewals30 = active.filter(m=>{ const d=daysOut(m); return d!==null && d>=0 && d<=30; });
  const renewals90 = active.filter(m=>{ const d=daysOut(m); return d!==null && d>=0 && d<=90; });
  const expired = rows.filter(m=>{ const d=daysOut(m); return d!==null && d<0; });

  const [start,end] = activeDateRange();
  const soldInRange = rows.filter(m=>m.startDate && inRange(m.startDate,start,end));

  container.innerHTML = `
    <div class="kpi-row">
      ${statTile({label:"Active Members", value: fmtNum(active.length)})}
      ${statTile({label:"Sold This Period", value: fmtNum(soldInRange.length)})}
      ${statTile({label:"Renewals Due (30d)", value: fmtNum(renewals30.length)})}
      ${statTile({label:"Renewals Due (90d)", value: fmtNum(renewals90.length)})}
      ${statTile({label:"Past Renewal Date", value: fmtNum(expired.length)})}
    </div>
    <div class="grid-2b">
      <div class="card"><h3>Active Members by Plan</h3><p class="card-sub">Plans as configured in ServiceTitan</p>
        ${byPlan.length ? barChart({data: byPlan, series:[{key:"v",label:"Members"}], sequential:true, valueFmt:fmtNum, width:520}) : emptyNote("No active memberships.")}
      </div>
      <div class="card"><h3>Upcoming Renewals</h3><p class="card-sub">Next 90 days</p>
        <div class="table-scroll">
        ${renewals90.length ? tableHTML([
          {label:"Plan", key:"plan"},
          {label:"Location", key:"loc"},
          {label:"Sold By", render:r=>personName(r.soldBy)},
          {label:"Renews", render:r=>fmtDate(r.renewDate)}
        ], renewals90.slice().sort((a,b)=>a.renewDate-b.renewDate)) : emptyNote("No renewals due in the next 90 days.")}
        </div>
      </div>
    </div>
  `;
  wireTooltips(container);
}

const RENDERERS = {
  revenue: renderRevenue, service: renderService, sales: renderSales, install: renderInstall,
  accounting: renderAccounting, marketing: renderMarketing, office: renderOffice, memberships: renderMemberships
};

/* ============================== APP SHELL ================================= */
function buildShell(){
  const nav = document.getElementById("tabNav");
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===state.tab?'active':''}">${t.label}</button>`).join("");
  const main = document.getElementById("main");
  main.innerHTML = TABS.map(t=>`<div class="panel ${t.id===state.tab?'active':''}" id="panel-${t.id}"></div>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
    state.tab = b.getAttribute("data-tab");
    state.drill = null;
    nav.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id === "panel-"+state.tab));
    renderActive();
  }));
}
function renderActive(){
  const panel = document.getElementById("panel-"+state.tab);
  RENDERERS[state.tab](panel);
}

// Drill open/close is delegated from <main>, so it survives every re-render
// without each renderer having to re-attach handlers.
document.getElementById("main").addEventListener("click", e => {
  const closer = e.target.closest("[data-drill-close]");
  if (closer) { state.drill = null; renderActive(); return; }
  const tile = e.target.closest("[data-drill]");
  if (!tile) return;
  const k = tile.getAttribute("data-drill");
  const opening = state.drill !== k;
  state.drill = opening ? k : null;   // clicking the open tile closes it
  renderActive();
  // The detail sits below the charts and rep table, so opening it from a tile at
  // the top would otherwise land off-screen with no visible feedback.
  if (opening) {
    const panel = document.querySelector(".drill");
    if (panel) {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      panel.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
    }
  }
});
function renderAllVisible(){ renderActive(); }

document.getElementById("locSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.loc = b.getAttribute("data-loc");
  state.drill = null;
  document.querySelectorAll("#locSeg button").forEach(x=>x.classList.toggle("active", x===b));
  renderAllVisible();
});
document.getElementById("rangeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.range = b.getAttribute("data-range");
  state.drill = null;
  document.querySelectorAll("#rangeSeg button").forEach(x=>x.classList.toggle("active", x===b));
  document.getElementById("customRange").classList.toggle("show", state.range==="CUSTOM");
  renderAllVisible();
});
document.getElementById("customStart").addEventListener("change", e=>{ state.customStart = new Date(e.target.value); renderAllVisible(); });
document.getElementById("customEnd").addEventListener("change", e=>{ state.customEnd = new Date(e.target.value); renderAllVisible(); });

(function initCustomDates(){
  document.getElementById("customStart").value = dkey(state.customStart);
  document.getElementById("customEnd").value = dkey(state.customEnd);
})();

buildShell();
renderActive();

// Target caption, assembled from whichever targets are actually configured.
function targetCaption(){
  const bits = [];
  if (TARGETS.avgTicket) bits.push(`avg ticket target ${fmtUSD0(TARGETS.avgTicket)}`);
  if (TARGETS.membershipAttachPct) bits.push(`membership target ${TARGETS.membershipAttachPct}%`);
  if (TARGETS.lowTicketPct) bits.push(`low-ticket target \u2264${TARGETS.lowTicketPct}%`);
  if (TARGETS.optionsPerCall) bits.push(`options/appt target ${TARGETS.optionsPerCall}`);
  return bits.length ? bits.join(" \u00b7 ")
                     : "No targets configured \u2014 set them in config.json to show target lines.";
}

// Header, location toggle and footer are all filled from config so the same
// file serves a one-location shop and a multi-location roll-up.
(function buildChrome(){
  const c = CONFIG.company || {};
  const name = c.name || "Operations Dashboard";
  document.title = c.subtitle ? `${name} \u2014 ${c.subtitle}` : name;
  document.getElementById("srTitle").textContent = c.subtitle ? `${name} \u2014 ${c.subtitle}` : name;

  const light = document.getElementById("logoLight"), dark = document.getElementById("logoDark");
  const hasLight = light.getAttribute("src") && light.getAttribute("src").length > 40;
  if (hasLight) {
    light.hidden = false; light.alt = name;
    if (dark.getAttribute("src") && dark.getAttribute("src").length > 40) dark.hidden = false;
    else { light.classList.remove("light-only"); }   // one logo, used in both themes
  } else {
    const w = document.getElementById("wordmark");
    w.textContent = name; w.hidden = false;
  }

  const sub = [c.subtitle, c.locationsLabel].filter(Boolean).join("  \u00b7  ");
  document.getElementById("brandSub").textContent = sub;

  // A single-location account has nothing to toggle between.
  const seg = document.getElementById("locSeg");
  if (LOCATIONS.length < 2) {
    seg.closest(".filter-group").hidden = true;
  } else {
    seg.innerHTML = `<button data-loc="ALL" class="active">Combined</button>` +
      LOCATIONS.map(l => `<button data-loc="${escAttr(l.id)}">${escXML(l.name)}</button>`).join("");
  }

  document.getElementById("footNote").textContent =
    `${name} \u00b7 Internal operations dashboard \u00b7 All figures pull live from ServiceTitan. ` +
    `Booked revenue reflects jobs priced on the dispatch board; membership attach is derived from ` +
    `same-day membership sales.`;

  if (LIVE_DATA.isDemo) {
    const b = document.createElement("div");
    b.className = "demo-banner";
    b.textContent = "DEMO DATA \u2014 these figures are randomly generated and describe no real business. "
                  + "Connect ServiceTitan and run fetch_dashboard_data.py for live numbers.";
    document.body.insertBefore(b, document.body.firstChild);
  }
})();

(function setDataStatusBadge(){
  const el = document.getElementById("dataStatusBadge");
  const genOn = new Date(LIVE_DATA.generatedAt);
  const stamp = genOn.toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
  // The refresh runs 3x daily, so anything past ~12h old means a run was missed
  // and the board may have moved on -- flag it rather than presenting it as current.
  const hoursOld = (Date.now() - genOn) / 3600000;
  const stale = hoursOld > 12;
  el.classList.toggle("stale", stale);
  el.innerHTML = `<span class="dot"></span>${LIVE_DATA.isDemo ? "Demo data" : "Live from ServiceTitan"} · ${stamp}` +
    (stale ? ` · ${Math.floor(hoursOld/24) >= 1 ? Math.floor(hoursOld/24)+"d" : Math.floor(hoursOld)+"h"} old` : "");
})();
</script>
